name: Deploy OrbitX to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'OrbitX-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbitx-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      VITE_BASE_PATH: /OrbitX/
    defaults:
      run:
        working-directory: OrbitX-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OrbitX-source/package-lock.json
      - run: npm install
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: OrbitX-source/dist
          force_orphan: true
