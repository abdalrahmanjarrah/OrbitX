name: Auto-deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$deploy_url" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is not set. Add it in GitHub repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS "$deploy_url"
